name = "discordgram"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
# ID del supergrupo de Telegram con foros/temas activados (ej: "-1001234567890")
DEFAULT_TELEGRAM_CHAT_ID = "-1001234567890"

# ID de tu servidor de Discord (necesario para /syncall y auto-descubrimiento)
DISCORD_GUILD_ID = ""

# Crear tema automáticamente en Telegram cuando se crea un canal de texto en Discord
AUTO_CREATE_TOPICS = "true"

# Contraseña de acceso al panel web (recomendado configurar con 'wrangler secret put DASHBOARD_PASSWORD')
DASHBOARD_PASSWORD = "admin"

# Secretos requeridos (configurar con 'wrangler secret put <NOMBRE>'):
# - DISCORD_BOT_TOKEN
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_WEBHOOK_SECRET
# - DASHBOARD_PASSWORD (opcional si se define en vars)
# - ALTCHA_HMAC_KEY (opcional para firma del captcha)

[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[durable_objects.bindings]]
name = "STATUS_STORE"
class_name = "StatusStore"

[[migrations]]
tag = "v1"
new_classes = ["DiscordGateway", "StatusStore"]
